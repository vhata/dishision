# Merge-blocking checks. Every job calls a script in scripts/ or
# docket/scripts/, so `bash scripts/check.sh && bash scripts/build.sh`
# reproduces the check job locally and `bash docket/scripts/ci.sh` the
# hygiene job. See docs/QUALITY.md.
name: CI

on:
  pull_request:
    # edited: the hygiene job reads the PR body from the event payload, and a
    # re-run reuses the original payload, so a changed body needs a new run.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash   # explicit bash gives `-eo pipefail`

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches only. Cancelling runs on main hides
  # red builds when several PRs merge in quick succession.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: bash scripts/setup.sh
      - run: mkdir -p evidence && bash scripts/check.sh 2>&1 | tee evidence/check.log
      - run: bash scripts/build.sh 2>&1 | tee evidence/build.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-failure-evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7

  workflow:
    name: Queue and PR hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Queue validation, link check and, on pull requests, the marker check.
      # The PR variables are empty on pushes, which skips the marker check.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash docket/scripts/ci.sh
